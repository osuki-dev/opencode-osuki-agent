name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked project dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated typechecking tools
        run: npm install --prefix "$RUNNER_TEMP/osuki-typecheck" --no-package-lock --ignore-scripts typescript@5.9.3 @types/bun@1.4.0
      - name: Typecheck
        run: node "$RUNNER_TEMP/osuki-typecheck/node_modules/typescript/bin/tsc" --noEmit --typeRoots "$RUNNER_TEMP/osuki-typecheck/node_modules/@types"
      - run: bun test
      - run: bun run build
      - name: Inspect the package contents
        run: npm pack --dry-run --ignore-scripts
